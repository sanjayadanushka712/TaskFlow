

services:
  api:
    build: .
    networks:
      - taskflow-net
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://taskflow:taskflow_dev@db:5432/taskflow"
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_dev
      POSTGRES_DB: taskflow
    networks:
      - taskflow-net
    volumes:
      - taskflow-data:/var/lib/postgresql/data

networks:
  taskflow-net:
    external: true

volumes:
  taskflow-data:
