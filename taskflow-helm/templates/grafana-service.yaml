apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskflow-helm.fullname" . }}-grafana
  labels:
    io.kompose.service: grafana
  {{- include "taskflow-helm.labels" . | nindent 4 }}
  annotations:
    kompose.cmd: kompose convert -o k8s/
    kompose.version: 1.38.0 (HEAD)
spec:
  type: {{ .Values.grafana.type }}
  selector:
    io.kompose.service: grafana
    {{- include "taskflow-helm.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.grafana.ports | toYaml | nindent 2 }}
