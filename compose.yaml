
services:
  api:
    build: .
    networks:
      - taskflow-net
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:
        ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - taskflow-net
    volumes:
      - taskflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  taskflow-net:
    external: true

volumes:
  taskflow-data:
